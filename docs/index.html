<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>เข้าสู่ระบบ · DekPro</title>
  <meta name="description" content="DekPro เว็บวางแผนเรียนต่อมหาวิทยาลัย TCAS">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="auth-page">
    <div class="card auth-card">
      <div class="brand"><span class="logo">D</span><span>DekPro</span></div>
      <h1>เข้าสู่ระบบ</h1>
      <p class="muted">วางแผนเรียนต่อมหาลัยของคุณให้ครบในที่เดียว</p>

      <form id="login-form" class="stack mt">
        <label class="field"><span>อีเมล</span>
          <input type="email" name="email" required autocomplete="email" placeholder="you@example.com">
        </label>
        <label class="field"><span>รหัสผ่าน</span>
          <input type="password" name="password" required autocomplete="current-password">
        </label>
        <div class="row"><span class="spacer"></span><a href="forgot.html" class="small">ลืมรหัสผ่าน?</a></div>
        <button class="btn btn-primary btn-block" type="submit">เข้าสู่ระบบ</button>
      </form>

      <p class="center muted mt">ยังไม่มีบัญชี? <a href="register.html">สร้างบัญชีใหม่</a></p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
