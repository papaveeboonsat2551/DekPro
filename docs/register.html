<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สร้างบัญชี · DekPro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="auth-page">
    <div class="card auth-card">
      <div class="auth-logo"><img class="brand-logo is-full" src="img/dekpro-logo.png" width="380" height="119" alt="DekPro ระบบวางแผนเตรียมสอบเข้ามหาลัย"></div>
      <h1>สร้างบัญชีใหม่</h1>
      <p class="muted">1 อีเมลสมัครได้ 1 บัญชีเท่านั้น</p>

      <form id="register-form" class="stack mt">
        <label class="field"><span>อีเมล</span>
          <input type="email" name="email" required autocomplete="email" placeholder="you@example.com">
        </label>
        <label class="field"><span>ตั้งรหัสผ่าน (อย่างน้อย 8 ตัว)</span>
          <input type="password" name="password" minlength="8" required autocomplete="new-password">
        </label>
        <label class="field"><span>ยืนยันรหัสผ่าน</span>
          <input type="password" name="confirm" minlength="8" required autocomplete="new-password">
        </label>
        <button class="btn btn-primary btn-block" type="submit">สร้างบัญชี</button>
      </form>

      <p class="center muted mt">มีบัญชีอยู่แล้ว? <a href="index.html">เข้าสู่ระบบ</a></p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
